<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDS124B Course Page</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .navbar {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 40px;
      border-bottom: 1px solid #e0e0e0;
    }

    .navbar h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .nav-links a {
      margin-left: 20px;
      text-decoration: none;
      color: #1d1d1f;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: #0071e3;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 30px;
    }

    .hero h2 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: #6e6e73;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .video-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      height: 250px;
      width: 400px;
      margin: 50px;
    }

    .video-card img {
      height: 200px;
      width: 400px;
    }

    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .video-title {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .thumbnail {
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .thumbnail:hover {
      transform: scale(1.02);
    }

    .links {
      margin-top: 10px;
    }

    .links a {
      display: inline-block;
      margin-right: 15px;
      text-decoration: none;
      color: #0071e3;
      font-size: 14px;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

  <div class="navbar">
